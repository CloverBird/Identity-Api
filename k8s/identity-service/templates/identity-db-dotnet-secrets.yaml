apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secret.dotnet.name }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  Database__Server: "{{ .Values.database.headlessService.name }}.{{ .Values.namespace }}.svc.cluster.local"
  Database__Port: {{ .Values.database.containerPort | quote }}
  Database__Username: {{ .Values.database.username }}
  Database__Name: guildly_identity_db
  Database__Password: postgres