apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.database.persistentVolume.name }}
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.database.storageClass.name }}
  hostPath:
    path: "/var/lib/docker/volumes/identity-service/identity-db"