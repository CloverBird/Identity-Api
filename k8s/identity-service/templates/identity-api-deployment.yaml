apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}-deployment
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.api.image.secretName }}
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.api.configMap.name }}
            - secretRef:
                name: {{ .Values.database.secret.dotnet.name }}
            - secretRef:
                name: {{ .Values.api.secretName }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5