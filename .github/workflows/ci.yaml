name: CI

on:
  push:
    branches: 
    - main
    - 'feature/**'
    - 'bugfix/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  
permissions:
  contents: read
  
jobs:
  build-and-test:
    name: Build-And-Test
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
      DOTNET_VERSION: '10.0.x'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Run unit tests
        run: dotnet test --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal --collect:"XPlat Code Coverage" --logger trx
  
  docker-pack-and-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    name: Docker-Pack-And-Push
    runs-on: ubuntu-latest

    
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: src/Guildly.Identity.Api/Dockerfile
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
    
  pack-and-push-to-artifacts:
    needs: build-and-test
    if: github.ref != 'refs/heads/main'
    name: Pack-And-Push-To-Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  
        
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          file: src/Guildly.Identity.Api/Dockerfile
          context: .
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
          
      - name: Save Docker image
        run: docker save ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest -o ${{ vars.DOCKERHUB_REPOSITORY }}-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.DOCKERHUB_REPOSITORY }}-image
          path: ${{ vars.DOCKERHUB_REPOSITORY }}-image.tar